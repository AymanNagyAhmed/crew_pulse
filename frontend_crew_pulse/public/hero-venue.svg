<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Venue entrance at service hour">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1a2f33"/>
      <stop offset="45%" stop-color="#243f3a"/>
      <stop offset="100%" stop-color="#0e1a1c"/>
    </linearGradient>
    <linearGradient id="warm" x1="0.2" y1="0.1" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#e8b86d" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#c47a3a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e1a1c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="72%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#f0d5a0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#8a5a2b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#warm)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <!-- Floor plane -->
  <path d="M0 620 L1600 560 L1600 900 L0 900 Z" fill="#121c1e"/>
  <path d="M0 620 L800 590 L1600 560" fill="none" stroke="#2a3d3f" stroke-width="2" opacity="0.5"/>
  <!-- Facade / doorway silhouette -->
  <rect x="520" y="180" width="560" height="440" fill="#0a1214" opacity="0.85"/>
  <rect x="560" y="220" width="200" height="400" fill="#152226"/>
  <rect x="840" y="220" width="200" height="400" fill="#152226"/>
  <rect x="760" y="300" width="80" height="320" fill="#1c3034"/>
  <!-- Soft window glow -->
  <rect x="580" y="260" width="160" height="120" fill="#d4a574" opacity="0.25"/>
  <rect x="860" y="260" width="160" height="120" fill="#d4a574" opacity="0.2"/>
  <!-- Distant staff shapes (abstract) -->
  <ellipse cx="1180" cy="520" rx="28" ry="70" fill="#1e2e30"/>
  <circle cx="1180" cy="430" r="22" fill="#24383a"/>
  <ellipse cx="1260" cy="530" rx="24" ry="60" fill="#1a282a"/>
  <circle cx="1260" cy="450" r="18" fill="#203234"/>
</svg>
