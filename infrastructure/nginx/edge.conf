# Edge reverse proxy — local vision match only (C10).
# Cloud api-gateway is reached out-of-band for roster pull / punch sync.

upstream vision_engine {
    server vision-engine:8000;
}

server {
    listen 80;
    server_name localhost;

    location /healthz {
        default_type application/json;
        return 200 '{"success":true,"statusCode":200,"message":"edge nginx ok","data":{"service":"edge-nginx","mode":"local-match"},"meta":{"requestId":"edge-nginx"}}';
    }

    location /vision/ {
        proxy_pass http://vision_engine/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # Face crops / match JSON only — not raw multi-MB video.
        client_max_body_size 512k;
    }

    location / {
        default_type text/plain;
        return 200 'CrewPulse edge — /vision/ → local vision-engine. Sync punches to cloud POST /v1/edge/sync/punches\n';
    }
}
