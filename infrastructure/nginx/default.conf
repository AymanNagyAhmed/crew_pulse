# Reverse proxy — Compose profile `edge`
upstream api_gateway {
    server api-gateway:3000;
}

upstream vision_engine {
    server vision-engine:8000;
}

server {
    listen 80;
    server_name localhost;

    location /healthz {
        default_type application/json;
        return 200 '{"success":true,"statusCode":200,"message":"nginx ok","data":{"service":"nginx"},"meta":{"requestId":"nginx"}}';
    }

    location /v1/ {
        proxy_pass http://api_gateway/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_http_version 1.1;
    }

    location /vision/ {
        proxy_pass http://vision_engine/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        default_type text/plain;
        return 200 'CrewPulse nginx — /v1/ → api-gateway, /vision/ → vision-engine\n';
    }
}
