# CrewPulse local stack — pin tags; digests recorded in infrastructure/README.md
name: crewpulse

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: crewpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crewpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crewpulse_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-crewpulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15434}:5432"
    volumes:
      - crewpulse_pg_data:/var/lib/postgresql/data
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2.11-alpine
    container_name: crewpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - crewpulse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    image: crewpulse/api-gateway:local
    container_name: crewpulse-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-3000}
      # Browser SPA (Vite) origins for local smoke; override via infrastructure/env/.env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173}
      # Compose network hostnames (host .env keeps localhost for non-Docker runs)
      DATABASE_URL: postgresql://${POSTGRES_USER:-crewpulse}:${POSTGRES_PASSWORD:-crewpulse_dev_change_me}@postgres:5432/${POSTGRES_DB:-crewpulse}
      REDIS_URL: redis://redis:6379
      VISION_ENGINE_URL: http://vision-engine:8000
    ports:
      - "127.0.0.1:${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-engine:
        condition: service_healthy

  vision-engine:
    build:
      context: ../../services/vision-engine
      dockerfile: Dockerfile
    image: crewpulse/vision-engine:local
    container_name: crewpulse-vision-engine
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: ${VISION_ENGINE_PORT:-8000}
      DEEPFACE_HOME: /data
      # Default stub so first boot does not require model weights; set VISION_STUB=false for real models
      VISION_STUB: ${VISION_STUB:-true}
      FACE_MIN_SIZE_PX: ${FACE_MIN_SIZE_PX:-80}
    ports:
      - "127.0.0.1:${VISION_ENGINE_PORT:-8000}:8000"
    volumes:
      - crewpulse_deepface_data:/data
      # Optional host weights: set DEEPFACE_HOST_DIR=~/.deepface (bind replaces named volume mount path)
      # - ${DEEPFACE_HOST_DIR:-}/.deepface:/data/.deepface:ro
    depends_on:
      redis:
        condition: service_healthy

  worker-node:
    build:
      context: ../../services/worker-node
      dockerfile: Dockerfile
    image: crewpulse/worker-node:local
    container_name: crewpulse-worker-node
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_NODE_PORT: ${WORKER_NODE_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-crewpulse}:${POSTGRES_PASSWORD:-crewpulse_dev_change_me}@postgres:5432/${POSTGRES_DB:-crewpulse}
      REDIS_URL: redis://redis:6379
      VISION_ENGINE_URL: http://vision-engine:8000
      ATTENDANCE_COOLDOWN_SECONDS: ${ATTENDANCE_COOLDOWN_SECONDS:-60}
    ports:
      - "127.0.0.1:${WORKER_NODE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision-engine:
        condition: service_healthy

  nginx:
    image: nginx:1.28.0-alpine
    container_name: crewpulse-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      vision-engine:
        condition: service_healthy
    profiles:
      - edge

volumes:
  crewpulse_pg_data:
  crewpulse_redis_data:
  crewpulse_deepface_data:
